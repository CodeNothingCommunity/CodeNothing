[package]
name = "CodeNothing"
version = "1.0.0"
edition = "2021"
authors = ["CodeNothing Team"]
description = "高性能基于堆栈的虚拟机，具备JIT编译和类似JVM的内存管理系统"
license = "MIT"
repository = "https://github.com/codenothing/codenothing"
keywords = ["vm", "virtual-machine", "interpreter", "compiler", "bytecode"]
categories = ["compilers", "development-tools"]
readme = "README.md"

[dependencies]
# Core dependencies for VM and JIT - Updated to latest version for better recursive function support
cranelift = "0.112"
cranelift-jit = "0.112"
cranelift-module = "0.112"
cranelift-codegen = "0.112"
target-lexicon = "0.12"

# Memory management and data structures
hashbrown = "0.14"
smallvec = "1.11"
bumpalo = "3.14"

# Utilities
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"

# Serialization for bytecode
serde = { version = "1.0", features = ["derive", "rc"] }
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

# Benchmarks will be added later
# [[bench]]
# name = "vm_benchmark"
# harness = false
